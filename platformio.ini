[platformio]
default_envs = pico2w
src_dir = firmware/pico/src
include_dir = firmware/pico/include

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2w
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py
build_flags = -Icommon/AquaBeacon/src

[env:pico2w]
build_flags = ${env.build_flags} -DAQ_WIFI=1

[env:pico2w_logger]
build_flags = ${env.build_flags} -DAQ_WIFI=0

; Diagnostic comparison only: keep normal transfer at 1 MHz, initialize at 100 kHz.
[env:pico2w_sd100]
build_flags = ${env.build_flags} -DAQ_WIFI=1 -DSD_MAX_INIT_RATE_KHZ=100
