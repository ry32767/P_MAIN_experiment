<!doctype html><html lang="ja"><meta charset="utf-8"><title>受信ゲイン調整</title>
<style>body{font:16px system-ui;background:#101b24;color:#e7eef4;margin:30px;max-width:1100px}h1{font-size:27px}button{background:#6be2b4;color:#10251e;border:0;padding:12px 22px;border-radius:8px;font-size:17px;cursor:pointer}.cards{display:flex;gap:25px;margin:24px 0;flex-wrap:wrap}.card{background:#1c2c39;padding:16px;border-radius:9px;min-width:150px}.value{font-size:26px;margin-top:8px}canvas{width:100%;height:330px;background:#172734;border-radius:8px}p{color:#b4c5d4;line-height:1.7}#shots{height:90px}.legend{color:#67e5b0}</style>
<h1>受信ゲイン調整 <small>60秒</small></h1><button id="start">1分間の計測を開始</button> <span id="phase">待機中</span>
<div class="cards"><div class="card">経過時間<div class="value" id="elapsed">0 / 60 秒</div></div><div class="card">最新ピーク<div class="value" id="peak">— mV</div></div><div class="card">受信判定<div class="value" id="rx">—</div></div><div class="card">比較器 / エッジ数<div class="value" id="cmp">—</div></div></div>
<p class="legend">受信電圧 ENV_ADC：緑＝ピーク　青＝平均　灰＝最小（20 msごと）</p><canvas id="chart"></canvas>
<p>送信ごとの判定：緑＝受信候補（未校正）　黄＝早期反応　赤＝検出なし / HIGH固定　灰＝待機・同期不成立</p><canvas id="shots"></canvas>
<p id="note">100 kサンプル/秒で取得。電圧はADC入力の値で、音圧やdBではありません。小容器・数cmの条件では反射や電気的回り込みを含みます。計測中は子機SD記録を一時停止し、終了後に再開します。</p>
<script>
const labels=['待機','検出なし','早期反応','受信候補','同期・取得失敗','HIGH固定'];
document.getElementById('start').onclick=()=>fetch('/start',{method:'POST'});
function canvas(id){let c=document.getElementById(id),d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;let x=c.getContext('2d');x.scale(d,d);return [x,c.clientWidth,c.clientHeight]}
async function draw(){try{let s=await(await fetch('/api/state')).json(),pts=s.points||[],last=pts.at(-1);document.getElementById('phase').textContent=s.error||s.phase;document.getElementById('elapsed').textContent=(s.elapsed||0).toFixed(1)+' / 60 秒';document.getElementById('peak').textContent=last?last.peak_mv+' mV':'—';document.getElementById('rx').textContent=labels[s.parent?.range_state]||'—';document.getElementById('cmp').textContent=last?(last.cmp?'HIGH':'LOW')+' / '+last.edges:'—';document.getElementById('start').disabled=!['待機中','完了（送信停止・SD記録再開）','エラー'].includes(s.phase);
let [x,w,h]=canvas('chart'),left=54,top=18,bottom=h-32,max=Math.max(500,...pts.map(p=>p.peak_mv))*1.12;max=Math.ceil(max/100)*100;
x.font='12px system-ui';for(let i=0;i<=4;i++){let y=bottom-(bottom-top)*i/4;x.strokeStyle='#304552';x.beginPath();x.moveTo(left,y);x.lineTo(w-10,y);x.stroke();x.fillStyle='#a5bacb';x.fillText(Math.round(max*i/4),3,y+4)}for(let t=0;t<=60;t+=10){x.fillStyle='#a5bacb';x.fillText(t+'s',left+(w-left-20)*t/60,bottom+22)}
for(let [key,col] of [['min_mv','#687988'],['mean_mv','#5caef7'],['peak_mv','#67e5b0']]){x.strokeStyle=col;x.lineWidth=1.3;x.beginPath();pts.forEach((p,i)=>{let a=left+(w-left-20)*p.t/60,b=bottom-(bottom-top)*p[key]/max;i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()}
let [z,sw,sh]=canvas('shots'),shots=new Map;for(let p of s.shots||[])shots.set(p.seq,p);for(let p of shots.values()){z.fillStyle=p.state===3?'#67e5b0':p.state===2?'#f7c75c':[1,5].includes(p.state)?'#ef7f79':'#78909e';z.beginPath();z.arc(54+(sw-74)*p.t/60,35,5,0,7);z.fill()}z.fillStyle='#a5bacb';z.fillText('ADC欠損サンプル: '+(last?.lost||0),12,75);
}catch(e){document.getElementById('phase').textContent='接続を確認しています'}setTimeout(draw,150)}draw();
</script></html>
